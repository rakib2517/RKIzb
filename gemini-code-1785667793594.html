<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Wallet</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Monetag SDK Link (আপনার মনিটেক স্ক্রিপ্টটি এখানে বসাবেন) -->
    <!-- <script src="//thubanoa.com/11460549/code.js"></script> -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f4f6f8; padding: 15px; color: #333; }
        .card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2, h3 { margin-bottom: 10px; }
        .btn { background: #007bff; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #dc3545; }
        input, select { width: 100%; padding: 10px; margin: 5px 0 10px; border: 1px solid #ccc; border-radius: 6px; }
        .task { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        #toastBox { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; display: none; z-index: 999; }
    </style>
</head>
<body>

    <!-- Dynamic Balance Display -->
    <div class="card" style="text-align: center;">
        <p>আপনার ব্যালেন্স</p>
        <h2 style="color: #28a745;"><span id="walletBalance">0.00</span> ৳</h2>
        <small id="status" style="color: #666;">রেডি</small>
    </div>

    <!-- Ad Actions -->
    <div class="card">
        <h3>টাস্ক / এডস</h3>
        <button class="btn" onclick="handleAd('pop')">এড দেখুন (+০.১৫৳)</button>
        <button class="btn btn-warning" onclick="startAds()">অটো ভিডিও এডস চালু করুন</button>
    </div>

    <!-- Withdraw Section -->
    <div class="card">
        <h3>উইথড্র করুন</h3>
        <input type="number" id="withdrawAmount" placeholder="পরিমাণ (মিনিমাম ৫০৳)">
        <select id="method">
            <option value="bKash">বিকাশ (bKash)</option>
            <option value="Nagad">নগদ (Nagad)</option>
            <option value="Rocket">রকেট (Rocket)</option>
        </select>
        <input type="text" id="number" placeholder="১১ ডিজিটের মোবাইল নম্বর">
        <button class="btn btn-success" onclick="withdrawNow()">উইথড্র রিকুয়েস্ট</button>
        <button class="btn" style="background:#6c757d;" onclick="toggleHistory()">হিস্ট্রি দেখুন</button>
    </div>

    <!-- History Card -->
    <div class="card" id="historyCard" style="display: none;">
        <h3>উইথড্র হিস্ট্রি</h3>
        <div id="withdrawHistory"></div>
    </div>

    <!-- Referral -->
    <div class="card">
        <h3>রেফারেল লিংক</h3>
        <p>আপনার কোড: <b id="refCode">---</b></p>
        <button class="btn btn-warning" onclick="shareReferral()">লিংক কপি করুন</button>
    </div>

    <!-- Top Ranking -->
    <div class="card">
        <h3>টপ লিডারবোর্ড</h3>
        <div id="rankingBox"></div>
    </div>

    <!-- Reset Data -->
    <div class="card">
        <button class="btn btn-danger" onclick="logoutUser()">ডেটা রিসেট করুন</button>
    </div>

    <!-- Toast Notification -->
    <div id="toastBox"></div>

<script>
// ১. টোস্ট নোটিফিকেশন ফাংশন
function toast(msg) {
    let t = document.getElementById("toastBox");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 3000);
}

// ২. ব্যালেন্স লোড এবং ম্যানেজমেন্ট
let balance = parseFloat(localStorage.getItem("balance")) || 0.00;

function updateBalanceDisplay() {
    let walletElement = document.getElementById("walletBalance");
    if (walletElement) {
        walletElement.innerText = balance.toFixed(2);
    }
    localStorage.setItem("balance", balance);
}

// প্রারম্ভিক ব্যালেন্স সেট
updateBalanceDisplay();

// Ads Handling
async function handleAd(type) {
    document.getElementById("status").innerText = "এড লোড হচ্ছে, অপেক্ষা করুন...";
    
    if (typeof show_11460549 === "function") {
        try {
            await show_11460549(type === 'pop' ? 'pop' : '');
            balance += 0.15;
            updateBalanceDisplay();
            toast("অভিনন্দন! ০.১৫৳ যোগ হয়েছে।");
            document.getElementById("status").innerText = "টাস্ক সম্পন্ন হয়েছে";
        } catch (e) {
            toast("এড লোড করতে ব্যর্থ। আবার চেষ্টা করুন।");
            document.getElementById("status").innerText = "সার্ভার বিজি";
        }
    } else {
        toast("Ad SDK লোড হচ্ছে... ৫ সেকেন্ড পর চেষ্টা করুন");
        document.getElementById("status").innerText = "SDK লোড হয়নি";
    }
}

function startAds() {
    if (typeof show_11460549 === "function") {
        show_11460549({ type: 'inApp', inAppSettings: { frequency: 2, interval: 30 } });
        toast("অটো ভিডিও এড চালু হয়েছে");
    } else {
        toast("SDK লোড হয়নি");
    }
}

// Withdraw Logic
function withdrawNow() {
    let amount = parseFloat(document.getElementById("withdrawAmount").value);
    let method = document.getElementById("method").value;
    let number = document.getElementById("number").value;

    if (isNaN(amount) || amount < 50) {
        toast("মিনিমাম ৫০ টাকা থাকতে হবে");
        return;
    }
    if (amount > balance) {
        toast("আপনার ব্যালেন্স কম");
        return;
    }
    if (number.length < 11) {
        toast("সঠিক ১১ ডিজিটের নাম্বার দিন");
        return;
    }

    balance -= amount;
    updateBalanceDisplay();

    let history = JSON.parse(localStorage.getItem("withdrawHistory") || "[]");
    history.unshift({ amount, method, number, status: "Pending", date: new Date().toLocaleDateString() });
    localStorage.setItem("withdrawHistory", JSON.stringify(history));

    toast("রিকুয়েস্ট সফল! ২৪ ঘণ্টার মধ্যে পেমেন্ট পাবেন।");
    loadWithdrawHistory();
}

function toggleHistory() {
    let box = document.getElementById("historyCard");
    box.style.display = box.style.display === "none" ? "block" : "none";
    if(box.style.display === "block") loadWithdrawHistory();
}

function loadWithdrawHistory() {
    let history = JSON.parse(localStorage.getItem("withdrawHistory") || "[]");
    let container = document.getElementById("withdrawHistory");
    if(history.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:gray;'>কোনো রেকর্ড নেই</p>";
        return;
    }
    container.innerHTML = history.map(item => `
        <div class="task">
            <div><b>${item.amount}৳ (${item.method})</b><br><small>${item.date}</small></div>
            <span style="color:${item.status==='Pending'?'#ff9800':'#22c55e'}; font-weight:bold;">${item.status}</span>
        </div>
    `).join('');
}

// Referral Logic
let ref = localStorage.getItem("refCode") || Math.random().toString(36).substring(2, 8).toUpperCase();
localStorage.setItem("refCode", ref);
if(document.getElementById("refCode")) {
    document.getElementById("refCode").innerText = ref;
}

function shareReferral() {
    let link = "https://t.me/YOUR_BOT_USERNAME?start=" + ref; 
    navigator.clipboard.writeText(link);
    toast("লিংক কপি হয়েছে! বন্ধুদের পাঠান।");
}

function logoutUser() {
    if(confirm("আপনি কি সব ডেটা মুছে ফেলতে চান?")) {
        localStorage.clear();
        location.reload();
    }
}

// Initial Ranking Load
function loadRanking() {
    const names = ["Rahim", "Karim", "Emran", "Jahid", "Siam", "Monir", "Tanvir", "Sajib"];
    let html = names.map((name, i) => `
        <div class="task">
            <div><b>#${i+1} ${name}</b><br><small>${(Math.random()*500 + 100).toFixed(2)}৳</small></div>
            <i class="fa-solid fa-trophy" style="color:#ff9800;"></i>
        </div>
    `).join('');
    let rankBox = document.getElementById("rankingBox");
    if(rankBox) rankBox.innerHTML = html;
}

// Call Ranking on Load
loadRanking();
</script>
</body>
</html>
